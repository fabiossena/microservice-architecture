name: microservice-architecture

x-service-env: &service-env
  RABBITMQ_URL: amqp://${RABBITMQ_USER:-orders}:${RABBITMQ_PASSWORD:-orders123}@rabbitmq:5672
  NODE_ENV: production
  TZ: UTC

x-service: &service
  restart: unless-stopped
  depends_on:
    rabbitmq:
      condition: service_healthy
  networks:
    - orders-net

services:
  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    container_name: orders-rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-orders}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-orders123}
      RABBITMQ_DEFAULT_VHOST: /
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 20s
    networks:
      - orders-net

  orders-service:
    build:
      context: ./orders-service
    <<: *service
    environment:
      <<: *service-env
      PORT: 8091
      DATA_DIR: /data
      AUTO_APPROVE_MS: 12000
    ports:
      - "8091:8091"
    volumes:
      - orders-data:/data
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8091/health"]
      interval: 15s
      timeout: 5s
      retries: 5

  catalog-service:
    build:
      context: ./catalog-service
    <<: *service
    environment:
      <<: *service-env
      PORT: 8094
      DATA_DIR: /data
    ports:
      - "8094:8094"
    volumes:
      - catalog-data:/data
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8094/health"]
      interval: 15s
      timeout: 5s
      retries: 5

  payments-service:
    build:
      context: ./payments-service
    <<: *service
    environment:
      <<: *service-env
      PORT: 8092
      DATA_DIR: /data
      PAYMENT_LIMIT: 1000
    ports:
      - "8092:8092"
    volumes:
      - payments-data:/data
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8092/health"]
      interval: 15s
      timeout: 5s
      retries: 5

  delivery-service:
    build:
      context: ./delivery-service
    <<: *service
    environment:
      <<: *service-env
      PORT: 8093
      DATA_DIR: /data
      DISPATCH_DELAY_MS: 5000
      DELIVERY_DELAY_MS: 15000
    ports:
      - "8093:8093"
    volumes:
      - delivery-data:/data
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8093/health"]
      interval: 15s
      timeout: 5s
      retries: 5

  notify-service:
    build:
      context: ./notify-service
    <<: *service
    environment:
      <<: *service-env
      PORT: 8095
      DATA_DIR: /data
    ports:
      - "8095:8095"
    volumes:
      - notify-data:/data
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8095/health"]
      interval: 15s
      timeout: 5s
      retries: 5

  order-user:
    build:
      context: ./order-user
    <<: *service
    environment:
      <<: *service-env
      PORT: 8081
      DATA_DIR: /data
      CATALOG_URL: http://catalog-service:8094
    ports:
      - "8071:8081"
    volumes:
      - order-user-data:/data
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8081/health"]
      interval: 15s
      timeout: 5s
      retries: 5

  order-manage-queue:
    build:
      context: ./order-manage-queue
    <<: *service
    environment:
      <<: *service-env
      PORT: 8082
      DATA_DIR: /data
      CATALOG_URL: http://catalog-service:8094
    ports:
      - "8072:8082"
    volumes:
      - order-manage-data:/data
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8082/health"]
      interval: 15s
      timeout: 5s
      retries: 5

  api-gateway:
    build:
      context: ./api-gateway
    <<: *service
    environment:
      <<: *service-env
      PORT: 8080
      ORDER_USER_URL: http://order-user:8081
      ORDER_MANAGE_URL: http://order-manage-queue:8082
      RABBITMQ_MANAGEMENT_URL: http://rabbitmq:15672
      RABBITMQ_USER: ${RABBITMQ_USER:-orders}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:-orders123}
      ORDERS_SERVICE_URL: http://orders-service:8091
      CATALOG_SERVICE_URL: http://catalog-service:8094
      PAYMENTS_SERVICE_URL: http://payments-service:8092
      DELIVERY_SERVICE_URL: http://delivery-service:8093
      NOTIFY_SERVICE_URL: http://notify-service:8095
    ports:
      - "8070:8080"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/health"]
      interval: 15s
      timeout: 5s
      retries: 5

networks:
  orders-net:
    driver: bridge

volumes:
  rabbitmq-data:
  orders-data:
  catalog-data:
  payments-data:
  delivery-data:
  notify-data:
  order-user-data:
  order-manage-data:
