name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service:
          - orders-service
          - catalog-service
          - payments-service
          - delivery-service
          - notify-service
    defaults:
      run:
        working-directory: ${{ matrix.service }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: ${{ matrix.service }}/package-lock.json
      - run: npm ci
      - run: npm test

  views-and-compose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Instalar dependências das views e gateway
        run: |
          npm ci
        working-directory: order-user
      - run: npm ci
        working-directory: order-manage-queue
      - run: npm ci
        working-directory: api-gateway
      - name: Checar sintaxe JavaScript
        run: |
          find . -name '*.js' -not -path '*/node_modules/*' -print0 | xargs -0 -n1 node --check
      - name: Validar Docker Compose
        run: docker compose config > /dev/null
